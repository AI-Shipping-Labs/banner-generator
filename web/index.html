<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Banner Generator Preview</title>
  <style>
    :root {
      --ink: #1e2136;
      --muted: #646980;
      --cream: #fdfaf3;
      --lavender: #eff1fc;
      --lavender-strong: #c9cdf2;
      --line: #d9dced;
      --green: #2b7a35;
      --danger: #a23d47;
      --shadow: 0 20px 50px rgba(30, 33, 54, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background: var(--lavender);
      color: var(--ink);
      font-family: "Trebuchet MS", Arial, sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button,
    select {
      cursor: pointer;
    }

    .workspace {
      width: min(1480px, 100%);
      margin: 0 auto;
    }

    h2,
    p {
      margin-top: 0;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(330px, 430px) minmax(0, 1fr);
      align-items: start;
      gap: 24px;
      padding: 28px 32px 48px;
    }

    .panel {
      border: 2px solid var(--ink);
      border-radius: 20px;
      background: rgba(253, 250, 243, 0.92);
      box-shadow: var(--shadow);
    }

    .controls-panel {
      position: sticky;
      top: 20px;
      padding: 22px;
    }

    .section-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin: 2px 0 14px;
    }

    .section-heading h2,
    .preview-heading h2 {
      margin: 0;
      font-size: 20px;
      letter-spacing: -0.03em;
    }

    .template-count {
      color: var(--muted);
      font-size: 12px;
    }

    .field-help {
      color: var(--muted);
      font-size: 12px;
    }

    .field {
      display: grid;
      gap: 6px;
      margin-bottom: 14px;
    }

    .field label,
    .field > label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    input,
    select {
      width: 100%;
      min-height: 42px;
      padding: 9px 11px;
      border: 1px solid var(--line);
      border-radius: 10px;
      outline: none;
      background: #fff;
      color: var(--ink);
    }

    input:focus,
    select:focus {
      border-color: var(--ink);
      box-shadow: 0 0 0 3px rgba(201, 205, 242, 0.8);
    }

    button,
    .download-link {
      display: inline-flex;
      min-height: 38px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 13px;
      border: 1px solid var(--ink);
      border-radius: 10px;
      background: transparent;
      color: var(--ink);
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
    }

    button:hover,
    .download-link:hover {
      background: var(--lavender);
    }

    button.primary {
      width: 100%;
      min-height: 48px;
      border-width: 2px;
      background: var(--ink);
      color: white;
      font-size: 15px;
    }

    button.primary:hover {
      background: #303552;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .placeholder-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 20px 0 9px;
    }

    .placeholder-heading h3 {
      margin: 0;
      font-size: 14px;
    }

    .placeholder-list {
      display: grid;
      gap: 8px;
      max-height: 410px;
      margin-bottom: 10px;
      overflow: auto;
      padding-right: 3px;
    }

    .placeholder-row {
      display: grid;
      grid-template-columns: minmax(100px, 0.7fr) minmax(0, 1.3fr);
      gap: 6px;
      align-items: center;
    }

    .placeholder-name {
      overflow-wrap: anywhere;
      color: var(--ink);
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-size: 12px;
      font-weight: 700;
    }

    .placeholder-row input {
      min-height: 36px;
      padding: 7px 9px;
      font-size: 12px;
    }

    .placeholder-row .placeholder-value {
      font-size: 13px;
    }

    .tabs {
      display: flex;
      gap: 4px;
      margin: 20px 0 14px;
      border-bottom: 1px solid var(--line);
    }

    .tab {
      min-height: 34px;
      margin-bottom: -1px;
      border: 0;
      border-bottom: 2px solid transparent;
      border-radius: 0;
      padding: 6px 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .tab:hover,
    .tab.active {
      background: transparent;
      color: var(--ink);
    }

    .tab.active {
      border-bottom-color: var(--ink);
    }

    .tab-panel[hidden] {
      display: none;
    }

    .definition-meta {
      margin: 0 0 9px;
      overflow-wrap: anywhere;
    }

    .preview-tabs {
      margin-top: 0;
    }

    .template-definition {
      max-height: 520px;
      margin: 0;
      overflow: auto;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #272b43;
      color: #f4f5ff;
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-size: 11px;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .load-example {
      width: 100%;
      margin: 6px 0 10px;
    }

    .status {
      min-height: 20px;
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .status.error {
      color: var(--danger);
    }

    .status.success {
      color: var(--green);
    }

    .preview-panel {
      min-width: 0;
      padding: 22px;
    }

    .preview-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 16px;
    }

    .preview-heading p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .download-link[hidden],
    #preview-image[hidden],
    #empty-state[hidden] {
      display: none;
    }

    .download-link {
      flex: 0 0 auto;
      background: var(--lavender-strong);
    }

    .preview-stage {
      display: grid;
      min-height: min(70vh, 760px);
      place-items: center;
      overflow: hidden;
      padding: 28px;
      border: 1px dashed #b5b9d0;
      border-radius: 14px;
      background: #e5e7f5;
    }

    #preview-image {
      display: block;
      max-width: 100%;
      max-height: min(70vh, 720px);
      border: 1px solid rgba(30, 33, 54, 0.25);
      border-radius: 10px;
      box-shadow: 0 14px 28px rgba(30, 33, 54, 0.2);
    }

    .empty-state {
      max-width: 360px;
      padding: 40px 24px;
      text-align: center;
    }

    .empty-mark {
      display: grid;
      width: 70px;
      height: 70px;
      margin: 0 auto 18px;
      place-items: center;
      border: 2px solid var(--ink);
      border-radius: 24px;
      background: var(--lavender-strong);
      font-size: 28px;
      font-weight: 700;
    }

    .empty-state h3 {
      margin-bottom: 8px;
      font-size: 20px;
    }

    .empty-state p {
      margin-bottom: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    @media (max-width: 900px) {
      .workspace {
        grid-template-columns: 1fr;
      }

      .controls-panel {
        position: static;
      }

      .placeholder-list {
        max-height: none;
      }
    }

    @media (max-width: 560px) {
      .workspace {
        padding-right: 16px;
        padding-left: 16px;
      }

      .workspace {
        padding-top: 16px;
      }

      .controls-panel,
      .preview-panel {
        padding: 16px;
      }

      .preview-stage {
        min-height: 360px;
        padding: 12px;
      }

      .preview-header {
        align-items: stretch;
        flex-direction: column;
        gap: 12px;
      }

      .download-link {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="workspace">
    <section class="panel controls-panel" aria-labelledby="controls-title">
      <form id="render-form">
        <div class="section-heading">
          <h2 id="controls-title">Build the input</h2>
          <span id="template-count" class="template-count">Loading templates…</span>
        </div>

        <div class="field">
          <label for="template-select">Template</label>
          <select id="template-select" required></select>
        </div>

        <div class="placeholder-heading">
          <h3>Template fields</h3>
          <span class="field-help">Fill in the values</span>
        </div>
        <div id="placeholder-fields" class="placeholder-list"></div>
        <button id="load-example" class="load-example" type="button">Load example</button>

        <button id="generate-button" class="primary" type="submit">Generate preview</button>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </form>
    </section>

    <section class="panel preview-panel" aria-labelledby="preview-title">
      <div class="tabs preview-tabs" role="tablist" aria-label="Template output">
        <button id="preview-tab" class="tab active" type="button" role="tab" aria-selected="true" aria-controls="preview-tab-panel">Preview</button>
        <button id="template-tab" class="tab" type="button" role="tab" aria-selected="false" aria-controls="template-tab-panel">Template</button>
        <button id="spec-tab" class="tab" type="button" role="tab" aria-selected="false" aria-controls="spec-tab-panel">Spec</button>
      </div>

      <div id="preview-tab-panel" class="tab-panel" role="tabpanel" aria-labelledby="preview-tab">
        <div class="preview-header">
          <div class="preview-heading">
            <h2 id="preview-title">Generated image</h2>
            <p id="preview-meta">Your preview will appear here.</p>
          </div>
          <a id="download-link" class="download-link" href="#" download="banner-preview.png" hidden>Download PNG</a>
        </div>

        <div class="preview-stage">
          <div id="empty-state" class="empty-state">
            <div class="empty-mark">↗</div>
            <h3>Ready when you are</h3>
            <p>Fill in the fields or load an example, then click Generate preview.</p>
          </div>
          <img id="preview-image" alt="Generated banner preview" hidden>
        </div>
      </div>

      <div id="template-tab-panel" class="tab-panel" role="tabpanel" aria-labelledby="template-tab" hidden>
        <p id="template-definition-meta" class="field-help definition-meta"></p>
        <pre id="template-definition" class="template-definition"></pre>
      </div>

      <div id="spec-tab-panel" class="tab-panel" role="tabpanel" aria-labelledby="spec-tab" hidden>
        <p id="spec-definition-meta" class="field-help definition-meta"></p>
        <pre id="spec-definition" class="template-definition"></pre>
      </div>
    </section>
  </main>

  <script>
    const state = { catalog: null, activeExample: null };
    const elements = {
      template: document.querySelector("#template-select"),
      loadExample: document.querySelector("#load-example"),
      previewTab: document.querySelector("#preview-tab"),
      templateTab: document.querySelector("#template-tab"),
      specTab: document.querySelector("#spec-tab"),
      previewPanel: document.querySelector("#preview-tab-panel"),
      templatePanel: document.querySelector("#template-tab-panel"),
      specPanel: document.querySelector("#spec-tab-panel"),
      templateDefinitionMeta: document.querySelector("#template-definition-meta"),
      definitionSource: document.querySelector("#template-definition"),
      specDefinitionMeta: document.querySelector("#spec-definition-meta"),
      specDefinition: document.querySelector("#spec-definition"),
      fields: document.querySelector("#placeholder-fields"),
      form: document.querySelector("#render-form"),
      generate: document.querySelector("#generate-button"),
      status: document.querySelector("#status"),
      templateCount: document.querySelector("#template-count"),
      preview: document.querySelector("#preview-image"),
      empty: document.querySelector("#empty-state"),
      meta: document.querySelector("#preview-meta"),
      download: document.querySelector("#download-link")
    };

    function templateDefinition(name) {
      return state.catalog.templates.find((template) => template.name === name);
    }

    function displayName(value) {
      return value
        .replace(/[-_]/g, " ")
        .replace(/\b\w/g, (letter) => letter.toUpperCase());
    }

    function setStatus(message, kind = "") {
      elements.status.textContent = message;
      elements.status.className = `status ${kind}`.trim();
    }

    function addField(name, value = "") {
      const row = document.createElement("div");
      row.className = "placeholder-row";
      row.dataset.placeholder = name;

      const label = document.createElement("label");
      label.className = "placeholder-name";
      label.textContent = name;

      const input = document.createElement("input");
      input.className = "placeholder-value";
      input.type = "text";
      input.placeholder = "Value";
      input.value = value == null ? "" : String(value);
      input.id = `placeholder-${name}`;
      input.setAttribute("aria-label", `${name} value`);
      label.htmlFor = input.id;

      row.append(label, input);
      elements.fields.append(row);
    }

    function renderFields(data = {}) {
      elements.fields.replaceChildren();
      const definition = templateDefinition(elements.template.value);
      if (!definition) return;
      definition.placeholders.forEach((name) => addField(name, data[name]));
    }

    function renderDefinition() {
      const definition = templateDefinition(elements.template.value);
      if (!definition) {
        elements.templateDefinitionMeta.textContent = "";
        elements.definitionSource.textContent = "";
        elements.specDefinitionMeta.textContent = "";
        elements.specDefinition.textContent = "";
        return;
      }
      elements.templateDefinitionMeta.textContent =
        `${definition.path} · ${definition.placeholders.length} placeholders`;
      elements.definitionSource.textContent = definition.definition;
      const activeExample = state.activeExample && state.activeExample.template === elements.template.value
        ? state.activeExample
        : null;
      const specPath = activeExample ? activeExample.path : definition.recommended_canvas && definition.recommended_canvas.source;
      const specDefinition = activeExample
        ? activeExample.definition
        : definition.recommended_canvas && definition.recommended_canvas.definition;
      elements.specDefinitionMeta.textContent = specPath || "No render spec available";
      elements.specDefinition.textContent = specDefinition || "";
    }

    function activateTab(tabName) {
      const tabs = {
        preview: [elements.previewTab, elements.previewPanel],
        template: [elements.templateTab, elements.templatePanel],
        spec: [elements.specTab, elements.specPanel]
      };
      Object.entries(tabs).forEach(([name, [tab, panel]]) => {
        const active = name === tabName;
        tab.classList.toggle("active", active);
        tab.setAttribute("aria-selected", String(active));
        panel.hidden = !active;
      });
    }

    function collectData() {
      const data = {};
      for (const row of elements.fields.querySelectorAll(".placeholder-row")) {
        const key = row.dataset.placeholder;
        const value = row.querySelector(".placeholder-value").value;
        if (value !== "") data[key] = value;
      }
      return data;
    }

    function exampleForTemplate() {
      return state.catalog.examples.find(
        (example) => example.template === elements.template.value
      );
    }

    function applyExample(example) {
      if (!example) {
        setStatus("No example is available for this template.", "error");
        return;
      }
      state.activeExample = example;
      elements.template.value = example.template;
      renderFields(example.data || {});
      renderDefinition();
      setStatus(`Loaded ${example.name}.`, "success");
    }

    function buildPayload() {
      const definition = templateDefinition(elements.template.value);
      const canvas = state.activeExample && state.activeExample.template === elements.template.value
        ? state.activeExample
        : definition && definition.recommended_canvas;
      if (!canvas) {
        throw new Error("No canvas is defined for this template.");
      }
      const usingExample = state.activeExample && state.activeExample.template === elements.template.value;
      const hasExplicitCanvas = usingExample
        ? canvas.width != null && canvas.height != null
        : !canvas.size;
      return {
        template: elements.template.value,
        size: canvas.size || "og",
        width: hasExplicitCanvas ? canvas.width : null,
        height: hasExplicitCanvas ? canvas.height : null,
        data: collectData()
      };
    }

    async function generate(event) {
      event.preventDefault();
      let payload;
      try {
        payload = buildPayload();
      } catch (error) {
        setStatus(error.message, "error");
        return;
      }

      elements.generate.disabled = true;
      elements.generate.textContent = "Rendering…";
      setStatus("Launching the local renderer…");

      try {
        const response = await fetch("/api/render", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Rendering failed.");

        elements.preview.src = result.image;
        elements.preview.hidden = false;
        elements.empty.hidden = true;
        elements.download.href = result.download || result.image;
        elements.download.download = result.download_name || `${payload.template}-${result.width}x${result.height}.png`;
        elements.download.textContent = `Download ${(result.download_format || "png").toUpperCase()}`;
        elements.download.hidden = false;
        elements.meta.textContent = `${displayName(result.template)} · ${result.width} × ${result.height} px`;
        setStatus("Preview generated.", "success");
      } catch (error) {
        setStatus(error.message || "Rendering failed.", "error");
      } finally {
        elements.generate.disabled = false;
        elements.generate.textContent = "Generate preview";
      }
    }

    async function loadCatalog() {
      const response = await fetch("/api/catalog");
      if (!response.ok) throw new Error("Could not load the template catalog.");
      state.catalog = await response.json();

      state.catalog.templates.forEach((template) => {
        const option = document.createElement("option");
        option.value = template.name;
        option.textContent = displayName(template.name);
        elements.template.append(option);
      });

      elements.template.value = state.catalog.templates.some((item) => item.name === "asl-content-card")
        ? "asl-content-card"
        : state.catalog.templates[0].name;
      elements.templateCount.textContent = `${state.catalog.templates.length} templates`;
      state.activeExample = null;
      renderFields();
      renderDefinition();
    }

    elements.template.addEventListener("change", () => {
      state.activeExample = null;
      renderFields();
      renderDefinition();
      setStatus("");
    });
    elements.previewTab.addEventListener("click", () => activateTab("preview"));
    elements.templateTab.addEventListener("click", () => activateTab("template"));
    elements.specTab.addEventListener("click", () => activateTab("spec"));
    elements.loadExample.addEventListener("click", () => applyExample(exampleForTemplate()));
    elements.form.addEventListener("submit", generate);

    loadCatalog().catch((error) => {
      setStatus(error.message, "error");
      elements.templateCount.textContent = "Unavailable";
    });
  </script>
</body>
</html>
