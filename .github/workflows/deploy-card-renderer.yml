name: Deploy private Card renderer
on:
  push:
    branches: [main]
    paths:
      - 'banner_generator/**'
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/deploy-card-renderer.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-card-renderer-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --dev
      - run: uv run pytest
      - run: uv run ruff check .
  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: eu-west-1
      IMAGE: 817685572750.dkr.ecr.eu-west-1.amazonaws.com/dataops-card-banner-renderer
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::817685572750:role/dataops-card-banner-renderer-deploy
          aws-region: eu-west-1
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - name: Build immutable reviewed image
        run: |
          if ! aws ecr describe-images --repository-name dataops-card-banner-renderer --image-ids imageTag="${{ github.sha }}" >/dev/null 2>&1; then
            docker buildx build --platform linux/amd64 --provenance=false --sbom=false \
              --tag "$IMAGE:${{ github.sha }}" --push .
          fi
      - name: Deploy private function and verify resolved image
        run: |
          DIGEST=$(aws ecr describe-images --repository-name dataops-card-banner-renderer --image-ids imageTag="${{ github.sha }}" --query 'imageDetails[0].imageDigest' --output text)
          aws lambda update-function-code --function-name dataops-card-banner-renderer --image-uri "$IMAGE@$DIGEST" >/dev/null
          aws lambda wait function-updated-v2 --function-name dataops-card-banner-renderer
          ACTUAL=$(aws lambda get-function --function-name dataops-card-banner-renderer --query 'Code.ResolvedImageUri' --output text)
          test "$ACTUAL" = "$IMAGE@$DIGEST"
