name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # required to assume the AWS role via OIDC

env:
  AWS_REGION: eu-west-1
  AWS_ACCOUNT_ID: "387546586013"
  ECR_REPOSITORY: banner-generator
  LAMBDA_FUNCTION: banner-generator

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --dev
      - run: uv run pytest
      - run: uv run ruff check .

  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/banner-generator-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
        run: |
          # Lambda doesn't accept OCI image indexes / attestations, so disable
          # provenance + SBOM and emit a single-arch linux/amd64 image.
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            --tag "$IMAGE:${{ github.sha }}" \
            --tag "$IMAGE:latest" \
            --push \
            .

      - name: Update Lambda function code
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
        run: |
          if aws lambda get-function --function-name "$LAMBDA_FUNCTION" >/dev/null 2>&1; then
            aws lambda update-function-code \
              --function-name "$LAMBDA_FUNCTION" \
              --image-uri "$IMAGE:${{ github.sha }}" \
              --publish
          else
            echo "::warning ::Lambda '$LAMBDA_FUNCTION' does not exist yet. Image is pushed to ECR; create the function with 'terraform apply -var banner_generator_enabled=true' in ai-shipping-labs-infra, then re-run."
          fi
