<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=${width}, initial-scale=1">
  <title>${title}</title>
  <link rel="stylesheet" href="style.css">
  <style>:root { --width: ${width}px; --height: ${height}px; }</style>
</head>
<!-- DataTalks.Club blog article preview. Title-first, so it never reads as a
     dtc-event-speaker picture. article.js builds the layout from the data attributes,
     so one template serves 0-4+ authors, the square 1000x1000 list thumbnail and the
     1200x630 (og) social card. An optional picture (the article's own image or
     illustration) fills the square alone and is a cover panel on the og card. -->
<body data-kind="${kind}" data-tone="${tone}" data-title="${title}" data-headline="${headline}"
      data-date="${date_label}" data-reading="${reading_time}" data-authors="${authors}"
      data-picture="${picture}">
  <script src="article.js"></script>
</body>
</html>
