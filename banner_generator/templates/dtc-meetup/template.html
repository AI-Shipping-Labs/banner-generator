<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=${width}, initial-scale=1">
  <title>${title}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    :root {
      --width: ${width}px;
      --height: ${height}px;
    }
  </style>
</head>
<body>
  <main class="canvas">
    <section class="poster" aria-label="Meetup: ${title}">
      <header class="badge-row">
        <svg class="wrench-icon" viewBox="0 0 64 64" aria-hidden="true">
          <path d="M47.6 10.4a13.5 13.5 0 0 0-16.8 16.8L12.6 45.4a5.2 5.2 0 0 0 7.4 7.4l18.2-18.2a13.5 13.5 0 0 0 16.8-16.8l-7.2 7.2-6.6-1.8-1.8-6.6 8.2-6.2z" fill="#295698"/>
        </svg>
        <div class="pill-badge">
          <span class="pill-left">MEETUP</span>
          <span class="pill-right">${format}</span>
        </div>
      </header>

      <div class="main-copy">
        <h1>${title}</h1>
        <p class="datetime">${datetime}</p>
      </div>

      <footer class="footer">
        <div class="dtc-brand" aria-label="DataTalks.Club">
          <svg class="dtc-logo" viewBox="0 0 280 86" role="img" aria-label="DataTalks.Club">
            <path d="M46 6C22.8 6 4 21.8 4 41.2c0 10.2 5.2 19.4 13.6 25.8L12 81l17.4-6.4c5.2 1.4 10.8 2.2 16.6 2.2 23.2 0 42-15.8 42-35.6C88 21.8 69.2 6 46 6z" fill="#295698"/>
            <text x="46" y="49" text-anchor="middle" fill="#ffffff" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="25" font-weight="800" letter-spacing="-0.5">DTC</text>
            <text x="102" y="38" fill="#295698" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.5">DataTalks.</text>
            <text x="102" y="68" fill="#295698" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.5">Club</text>
          </svg>
        </div>

        <div class="speaker-name">${speaker}</div>
      </footer>
    </section>
  </main>
</body>
</html>
