<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=${width}, initial-scale=1">
  <title>${title}</title>
  <link rel="stylesheet" href="style.css">
  <style>
    :root {
      --width: ${width}px;
      --height: ${height}px;
    }
  </style>
</head>
<body>
  <main class="canvas">
    <section class="poster" aria-label="Meetup: ${title}">
      <div class="shape" aria-hidden="true"></div>

      <header class="top">
        <img class="dtc-logo" src="../shared/logo_main.svg" alt="DataTalks.Club">
        <div class="badge-row">
          <span class="badge badge-kind">MEETUP</span>
          <span class="badge badge-format">${format}</span>
        </div>
      </header>

      <div class="main-copy">
        <h1>${title}</h1>
      </div>

      <footer class="footer">
        <div class="speaker-name">${speaker}</div>
        <p class="datetime">${datetime}</p>
      </footer>
    </section>
  </main>
</body>
</html>
