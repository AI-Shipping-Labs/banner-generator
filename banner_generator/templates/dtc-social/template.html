<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=${width}, initial-scale=1">
  <title>${title}</title>
  <link rel="stylesheet" href="style.css">
  <style>
    :root {
      --width: ${width}px;
      --height: ${height}px;
      --title-size: ${title_size}px;
      --subtitle-size: ${subtitle_size}px;
    }
  </style>
</head>
<body class="variant-${variant} channel-${channel} theme-${theme} ${course_image_class} ${cover_image_class}">
  <main class="canvas">
    <section class="poster" aria-label="${kind}: ${title}">
      <div class="shape shape-accent" aria-hidden="true"></div>

      <header class="top">
        <div class="brand">
          <img class="brand-logo brand-logo-light" src="../shared/logo_main.svg" alt="${brand}">
          <img class="brand-logo brand-logo-dark" src="../shared/logo_white.svg" alt="${brand}">
        </div>
        <div class="kind">${kind}</div>
      </header>

      <div class="content">
        <section class="copy">
          <div class="kicker">${kicker}</div>
          <h1>${title}</h1>
          <p class="subtitle">${subtitle}</p>
        </section>

        <aside class="book-art" aria-hidden="true">
          <img src="${cover_image_url}" alt="" decoding="sync">
        </aside>

        <aside class="course-art" aria-hidden="true">
          <img class="course-art-light" src="${course_image_url}" alt="" decoding="sync">
          <img class="course-art-dark" src="${course_image_dark_url}" alt="" decoding="sync">
        </aside>

        <aside class="feature" aria-label="Banner details">
          <div class="main-avatar avatar" aria-hidden="true">
            <span class="avatar-initials">${person_initials}</span>
            <img src="${image_url}" alt="" onerror="this.remove()">
          </div>
          <div class="metadata">
            <b>${meta_primary}</b>
            <strong>${meta_secondary}</strong>
            <span>${meta_tertiary}</span>
          </div>
        </aside>
      </div>

      <footer class="bottom">
        <div class="person">
          <div class="avatar">
            <span class="avatar-initials">${person_initials}</span>
            <img src="${image_url}" alt="" onerror="this.remove()">
          </div>
          <div class="person-copy">
            <b>${person}</b>
            <span>${person_role}</span>
          </div>
        </div>
        <div class="footer-brand">${footer}</div>
      </footer>
    </section>
  </main>
</body>
</html>
