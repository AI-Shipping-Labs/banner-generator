<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=${width}, initial-scale=1">
  <title>${title}</title>
  <link rel="stylesheet" href="style.css">
  <style>:root { --width: ${width}px; --height: ${height}px; }</style>
</head>
<!-- Speaker-led DataTalks.Club event picture. The layout is built by event.js from
     the data attributes, so one template serves 0-4+ speakers, the square
     1000x1000 (luma) canvas and the 1200x630 (og) social canvas. -->
<body data-kind="${kind}" data-title="${title}" data-headline="${headline}" data-date="${date_label}"
      data-time="${time_label}" data-speakers="${speakers}" data-sponsor="${sponsor}">
  <div class="blob" aria-hidden="true"></div>
  <script src="event.js"></script>
</body>
</html>
